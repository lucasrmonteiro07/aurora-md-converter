<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>

  <!-- Glow backdrop bars -->
  <rect x="14" y="28" width="9" height="22" rx="4" fill="#d946ef" opacity="0.15"/>
  <rect x="27" y="16" width="9" height="34" rx="4" fill="#06b6d4" opacity="0.15"/>
  <rect x="40" y="22" width="9" height="28" rx="4" fill="#10b981" opacity="0.15"/>

  <!-- Bars -->
  <rect x="14" y="30" width="9" height="20" rx="4" fill="url(#bar1)" filter="url(#glow)"/>
  <rect x="27" y="18" width="9" height="32" rx="4" fill="url(#bar2)" filter="url(#glow)"/>
  <rect x="40" y="24" width="9" height="26" rx="4" fill="url(#bar3)" filter="url(#glow)"/>

  <!-- Arc wave on top -->
  <path d="M12 28 Q32 8 52 28" stroke="url(#arc)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.9"/>

  <!-- Border ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#arc)" stroke-width="1.2" fill="none" opacity="0.5"/>
</svg>
